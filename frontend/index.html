<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/system_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ImitiPharmaFind — Find medicines at pharmacies near you in Musanze, Rwanda." />
    <title>ImitiPharmaFind</title>
    <!-- Inline script to prevent flash of wrong theme before React hydrates -->
    <script>
      (function() {
        var stored = localStorage.getItem('imiti_theme');
        if (stored === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
